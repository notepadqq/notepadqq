<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Notepadqq</title>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="libs/jquery/jquery.min.js"></script>

    <!-- Monaco Editor -->
    <script src="libs/monaco/vs/loader.js"></script>

    <script src="init.js"></script>
    <script src="classes/UiDriver.js"></script>
    <script src="classes/Printer.js"></script>

    <link rel="stylesheet" href="styles/app.css">
    <link rel="stylesheet" href="styles/app-print.css" />
  </head>
  <body>
    <div class="editor"></div>

    <script>
      // Use absolute path for Monaco so workers resolve correctly from file://
      var monacoBasePath = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + "/libs/monaco/vs";
      self.MonacoEnvironment = {
        getWorker: function(moduleId, label) {
          var workerUrl = monacoBasePath + "/base/worker/workerMain.js";
          var worker = new Worker(workerUrl);
          // Logs the worker source when Qt WebEngine otherwise reports only "[object Event]".
          worker.addEventListener("error", function(event) {
            console.error("Monaco worker failed", {
              moduleId: moduleId,
              label: label,
              workerUrl: workerUrl,
              message: event.message,
              filename: event.filename,
              line: event.lineno,
              column: event.colno
            });
          });
          return worker;
        }
      };

      // Preserves the rejection details that Monaco's loader otherwise renders as "[object Event]".
      window.addEventListener("unhandledrejection", function(event) {
        console.error("Unhandled Monaco promise rejection", event.reason);
      });

      require.config({
        paths: { vs: monacoBasePath }
      });

      require(["vs/editor/editor.main"], function () {
        var appScript = document.createElement("script");
        appScript.src = "app_monaco.js";
        document.body.appendChild(appScript);
      });
    </script>
  </body>
</html>
